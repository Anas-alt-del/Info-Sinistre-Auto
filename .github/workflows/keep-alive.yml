name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping main service
        run: curl -s https://projet-c56-c57-web-app-infos-sinistre.onrender.com/health
      
      - name: Ping auth service
        run: curl -s https://projet-c56-c57-service-auth.onrender.com/health
      
      - name: Ping collecte service
        run: curl -s https://projet-c56-c57-service-collecte.onrender.com/health
      
      - name: Ping dao service
        run: curl -s https://projet-c56-c57.onrender.com/health
      
      - name: Ping data service
        run: curl -s https://projet-c56-c57-lr9p.onrender.com/health
