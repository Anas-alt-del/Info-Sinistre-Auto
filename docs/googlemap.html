<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embedded Map Example</title>
</head>
<body>

  <h2>Our Location</h2>

  <!-- Standard Google Maps Embed -->
  <iframe 
  width="600" 
  height="450" 
  style="border:0" 
  loading="lazy" 
  allowfullscreen 
  src="https://maps.google.com/maps?q=45.5358,-73.6163&z=15&output=embed">
</iframe>

</body>
</html>
